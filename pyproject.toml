[project]
name = "nbpipe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.2.0",
    "jupyter-client>=8.0",
    "nbformat>=5.10.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
nbpipe = "nbpipe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

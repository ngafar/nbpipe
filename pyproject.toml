[project]
name = "nbpipe"
version = "0.1.1"
description = "Run sequences of Jupyter notebooks as a workflow from the command line."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nawaz Gafar" }]
keywords = ["jupyter", "notebook", "workflow", "pipeline", "automation", "nbformat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "ipykernel>=7.2.0",
    "jupyter-client>=8.0",
    "nbformat>=5.10.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
nbpipe = "nbpipe.cli:main"

[project.urls]
Homepage = "https://github.com/ngafar/nbpipe"
Repository = "https://github.com/ngafar/nbpipe"
Issues = "https://github.com/ngafar/nbpipe/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
